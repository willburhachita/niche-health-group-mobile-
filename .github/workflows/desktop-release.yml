name: Desktop release

# Builds the NHL Connect Windows installer.
#
#   - Push a `desktop-v*` tag  -> builds, then publishes a GitHub Release with
#                                 the installer attached.
#   - Run manually              -> builds and attaches the installer as a
#     (Actions -> Run workflow)    workflow artifact. Ticking "publish" also
#                                  tags the commit and publishes the Release.
#
# Cutting a release, either way:
#   - git tag desktop-v1.0.1 && git push origin desktop-v1.0.1
#   - or Actions -> Desktop release -> Run workflow -> publish: true
#
# The tag version and apps/desktop/package.json must agree — the build fails
# early if they don't, so a mislabelled installer can't reach testers.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (tags the commit with the version in apps/desktop/package.json)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Work out the release tag
        id: release
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            tag_version="${GITHUB_REF_NAME#desktop-v}"
            if [ "$tag_version" != "$pkg_version" ]; then
              echo "::error::Tag is $GITHUB_REF_NAME (version $tag_version) but apps/desktop/package.json says $pkg_version."
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=desktop-v$pkg_version" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          fi

          echo "Building version $pkg_version"

      - name: Run tests
        run: npm test

      - name: Build the renderer
        run: npm run build

      - name: Package the Windows installer
        run: npx electron-builder --win --x64 --publish never

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nhl-connect-windows
          path: |
            apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe --clobber
          else
            # --target creates the tag when it doesn't exist yet, so a manual
            # run can cut a release without a tag being pushed first.
            gh release create "$TAG" release/*.exe \
              --target "$GITHUB_SHA" \
              --title "NHL Connect $VERSION" \
              --generate-notes
          fi
